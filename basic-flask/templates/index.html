<!DOCTYPE html>
<html>
<head>
    <title>Climber Prediction Form</title>
</head>
<body>
    <h3>Climber Prediction Form</h3>
    <form action="/result" method="POST">
        <label for="discipline_boulder">Discipline Boulder (1=yes, 0=no)</label>
        <input type="number" id="discipline_boulder" name="discipline_boulder" value="0" min="0" max="1" required><br>

        <label for="discipline_lead">Discipline Lead (1=yes, 0=no)</label>
        <input type="number" id="discipline_lead" name="discipline_lead" value="0" min="0" max="1" required><br>

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
        </select><br>

        <label for="age_at_comp">Age at Competition</label>
        <input type="number" step="0.01" id="age_at_comp" name="age_at_comp" required><br>

        <label for="country">Country</label>
        <input type="text" id="country" name="country" required><br>

      <label for="season">Season (Year, e.g., 2024):</label>
      <input type="number" id="season" name="season" required><br><br>

      <label for="athlete_id">Climber ID (Numerical ID):</label>
      <input type="number" id="athlete_id" name="athlete_id" required><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
